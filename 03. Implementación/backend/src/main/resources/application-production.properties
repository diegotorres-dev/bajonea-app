server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQL_PUBLIC_HOST}:${MYSQL_PUBLIC_PORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.connect-retries=10

jwt.secret=${JWT_SECRET:cambiar-en-produccion-por-variable-de-entorno}
jwt.expiration-ms=86400000

resend.api-key=${RESEND_API_KEY:}
mail.from=${MAIL_FROM:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

mercadopago.token-encryption-key=${MERCADOPAGO_TOKEN_ENCRYPTION_KEY:}
mercadopago.client-id=${MERCADOPAGO_CLIENT_ID:}
mercadopago.client-secret=${MERCADOPAGO_CLIENT_SECRET:}
mercadopago.redirect-uri=${MERCADOPAGO_REDIRECT_URI:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.test-token=${MERCADOPAGO_TEST_TOKEN:false}

app.frontend-base-url=${FRONTEND_BASE_URL:https://bajonea.ar}
app.backend-base-url=${BACKEND_BASE_URL:}

springdoc.swagger-ui.persist-authorization=true
