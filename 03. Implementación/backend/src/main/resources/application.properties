server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bajonea_final
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=bajonea_final ya existente antes de Flyway (Tramo 1, 2026-08-27)

jwt.secret=${JWT_SECRET:cambiar-en-produccion-por-variable-de-entorno}
jwt.expiration-ms=86400000

resend.api-key=${RESEND_API_KEY:}
mail.from=${MAIL_FROM:}
email.envio-habilitado=true

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

mercadopago.token-encryption-key=${MERCADOPAGO_TOKEN_ENCRYPTION_KEY:}
mercadopago.client-id=${MERCADOPAGO_CLIENT_ID:}
mercadopago.client-secret=${MERCADOPAGO_CLIENT_SECRET:}
mercadopago.redirect-uri=${MERCADOPAGO_REDIRECT_URI:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.test-token=${MERCADOPAGO_TEST_TOKEN:false}

app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5501}
app.backend-base-url=${BACKEND_BASE_URL:}

springdoc.swagger-ui.persist-authorization=true

pedido.timeout.pago-minutos=30
pedido.timeout.aviso-en-camino-minutos=75
pedido.timeout.autoconfirmacion-en-camino-minutos=90
pedido.timeout.respuesta-comercio-minutos=30
pedido.timeout.retiro-suspension-minutos=90

comercio.resolicitudes.max=3

# Reintentos al generar un código de token (verificación, recuperación, reactivación) ante colisión del UNIQUE global
token.generacion.max-intentos=20

# Documentos del comercio (Fase 4). El tope duro de multipart es el doble del maximo del negocio (8 MB, en
# comercio.documentacion.max-bytes): el maximo exacto se valida en el servicio para poder decir cuanto pesa el
# archivo; por encima del tope duro responde GlobalExceptionHandler con el tamano del Content-Length.
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=17MB
# Si el pedido supera el tope duro, Tomcat lee y descarta el resto del cuerpo antes de responder; con el valor
# por defecto (2 MB) corta la conexion y el navegador solo ve un error de red en lugar del 400 con el tamano
# del archivo. El cuerpo descartado no se guarda; por encima de este tamano la conexion se corta igual (el tope duro es 17 MB y el cliente bloquea todo lo mayor a 8 MB).
server.tomcat.max-swallow-size=32MB
