spring.datasource.url=jdbc:mysql://localhost:3306/bajonea_test
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# La suite de Playwright (Fase 17) registra varios comercios/clientes reales en poco tiempo
# desde la misma IP (localhost) -- el default de 5/min (RateLimitFotoRegistroFilter) es
# correcto como control anti-abuso real, pero alcanza en segundos corriendo la suite completa.
app.rate-limit.foto-registro-por-minuto=1000

# Validar y aceptar invitaciones de empleado (RateLimitPublicoFilter): el default de 10/min por IP es el
# control anti-abuso real; las suites de E2E y estrés lo superan sin intentar abusar de nada.
app.rate-limit.invitacion-empleado-por-minuto=1000

# Consultas de disponibilidad en vivo (nombre de usuario y de comercio, RateLimitPublicoFilter): el default de 30/min
# por IP es el control anti-abuso real; los E2E y el estres consultan mucho mas.
app.rate-limit.disponibilidad-por-minuto=1000

# Los E2E y Newman obtienen los códigos de GET /api/v1/test/token (base de datos), nunca del correo:
# no se llama a Resend, solo se registra el destinatario y el asunto.
email.envio-habilitado=false

# El proceso de vencimiento de invitaciones de empleado no corre solo en las pruebas: se dispara a pedido con
# POST /api/v1/test/jobs/vencimiento-invitaciones, para que los tests sean deterministas.
invitacion.vencimiento.job-habilitado=false

# Los cuatro procesos automáticos de pedidos (expiración de pago, aviso y autoconfirmación en camino, expiración sin
# respuesta del comercio y retiro por suspensión) no corren solos en las pruebas: se disparan a pedido con
# POST /api/v1/test/jobs/pedidos/{nombre}?ahora=, para que los tests y el estrés sean deterministas.
pedido.jobs.habilitado=false

# La reapertura automática del cierre manual de comercios no corre sola en las pruebas: se dispara a pedido con
# POST /api/v1/test/jobs/reapertura-comercios?ahora=, para que los tests y el estrés sean deterministas.
comercio.reapertura.job-habilitado=false

# La asignación de turnos a los pedidos anteriores a la migración V39 no corre sola en las pruebas: se dispara a
# pedido con POST /api/v1/test/jobs/backfill-turnos, para que los tests sean deterministas.
turno.backfill.habilitado=false

# El bloqueo del cambio de precio dentro de una franja horaria esta apagado en las pruebas: los comercios de test tienen
# una franja de 00:00 a 23:59 el dia de su registro y todo cambio de precio recibiria 409. Los specs que lo prueban lo
# encienden con PUT /api/v1/test/precio-bloqueo?habilitado=true y lo apagan siempre al terminar.
precio.bloqueo-en-franja.habilitado=false

# El cierre de turnos y el envio del resumen al Dueno no corren solos en las pruebas: se disparan a pedido con
# POST /api/v1/test/jobs/cierre-turnos?ahora=, para que los tests y el estres sean deterministas.
turno.cierre.job-habilitado=false

# La exigencia de documentos para vender esta apagada en las pruebas: casi todos los specs y colecciones llevan un
# comercio a APTO_VENTA solo con Mercado Pago. Los que prueban la regla la encienden con
# PUT /api/v1/test/documentacion-requerida?habilitado=true (y la apagan siempre al terminar); los pocos que tocan el
# cambio de estado con la exigencia encendida aprueban la documentacion con
# PUT /api/v1/test/comercios/{id}/documentacion-aprobada.
comercio.documentacion.requerida=false

# Cada contexto de Spring que la suite de Java deja en cache mantiene su propio pool de Hikari, y por defecto cada pool abre
# 10 conexiones de entrada (minimum-idle igual al maximo). Con 150 conexiones en MariaDB (el valor por defecto de XAMPP) la
# suite completa llegaba al limite y los ultimos contextos fallaban con "Too many connections". Con 2 conexiones ociosas por
# pool el maximo de cada uno sigue siendo 10 (la concurrencia de las pruebas no cambia) pero el pico baja a la mitad.
spring.datasource.hikari.minimum-idle=2

# El perfil de test conserva el tamano y la espera por defecto de Hikari (10 conexiones, 30 s) aunque application.properties
# los defina distintos: el estres y las pruebas de concurrencia tienen que detectar cualquier transaccion que vuelva a
# pedir una segunda conexion mientras sostiene la primera, y con un pool mas grande ese defecto desaparece del radar.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=0
