spring.datasource.url=jdbc:mysql://localhost:3306/bajonea_test
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# La suite de Playwright (Fase 17) registra varios comercios/clientes reales en poco tiempo
# desde la misma IP (localhost) -- el default de 5/min (RateLimitFotoRegistroFilter) es
# correcto como control anti-abuso real, pero alcanza en segundos corriendo la suite completa.
app.rate-limit.foto-registro-por-minuto=1000

# Validar y aceptar invitaciones de empleado (RateLimitPublicoFilter): el default de 10/min por IP es el
# control anti-abuso real; las suites de E2E y estrés lo superan sin intentar abusar de nada.
app.rate-limit.invitacion-empleado-por-minuto=1000

# Los E2E y Newman obtienen los códigos de GET /api/v1/test/token (base de datos), nunca del correo:
# no se llama a Resend, solo se registra el destinatario y el asunto.
email.envio-habilitado=false

# El proceso de vencimiento de invitaciones de empleado no corre solo en las pruebas: se dispara a pedido con
# POST /api/v1/test/jobs/vencimiento-invitaciones, para que los tests sean deterministas.
invitacion.vencimiento.job-habilitado=false
