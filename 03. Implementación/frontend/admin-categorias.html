<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Categorías — Bajoneá</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/escritorio.css" media="(min-width: 1024px)" />
<script type="module" src="js/admin-shell.js"></script>
</head>
<body data-admin-nav="categorias">
<div class="app-shell">
  <header class="app-header">
    <button class="app-header__back" type="button" data-volver="admin-dashboard.html" aria-label="Volver" data-testid="btn-volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="app-header__title app-header__title--admin">Categorías</span>
    <div class="encabezado-accion-escritorio" hidden>
      <button class="btn btn-primary" type="button" id="nueva-categoria-escritorio" disabled data-testid="btn-nueva-categoria-escritorio">Nueva categoría</button>
    </div>
  </header>
  <main class="app-main">
    <div class="chip-row" id="categorias-chip-row" data-testid="fila-chips-filtro"></div>
    <div class="screen-body screen-body--tight" id="categorias-content" data-testid="lista-categorias"></div>
  </main>
  <button class="fab" type="button" id="crear-categoria-fab" aria-label="Crear categoría" data-testid="btn-crear-categoria" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
</div>
<script type="module">
import { initAdminCategorias } from './js/admin.js';
initAdminCategorias();
</script>
</body>
</html>
