<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel del administrador — Bajoneá</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/escritorio.css" media="(min-width: 1024px)" />
<script type="module" src="js/admin-shell.js"></script>
</head>
<body data-admin-nav="panel">
<div class="app-shell">
  <div id="top-bar-slot"></div>
  <main class="app-main">
    <div class="screen-body admin-panel">
      <div class="admin-panel__cabecera" hidden>
        <h1 class="admin-panel__titulo" data-testid="titulo-panel-admin">Panel</h1>
        <p class="admin-panel__bajada">Lo que necesita tu atención y accesos a la gestión de la plataforma.</p>
      </div>
      <div class="summary-card admin-saludo">
        <div class="summary-card__icon admin-saludo__avatar" id="admin-avatar">AD</div>
        <div class="summary-card__body">
          <p>Administrador</p>
          <h3 id="admin-nombre" data-testid="nombre-admin"><span class="skeleton skeleton-linea-corta"></span></h3>
        </div>
      </div>

      <p class="section-heading">Requieren <span class="solo-movil">Atención</span><span class="solo-escritorio">atención</span></p>
      <div class="admin-alertas" id="admin-alertas">
      <a class="alert-card" href="admin-comercios-pendientes.html" id="alert-comercios-pendientes" data-testid="btn-comercios-pendientes">
        <div class="alert-card__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
        </div>
        <div class="alert-card__body">
          <h3>Comercios Pendientes</h3>
          <p data-subtitulo><span class="skeleton skeleton-linea-corta"></span></p>
        </div>
        <div class="alert-card__side">
          <span class="alert-card__count alert-card__count--numero" data-count data-testid="contador-comercios-pendientes"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </a>
      <a class="alert-card alert-card--acento" href="admin-resolicitudes.html" id="alert-resolicitudes" data-testid="btn-resolicitudes">
        <div class="alert-card__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </div>
        <div class="alert-card__body">
          <h3>Re-solicitudes</h3>
          <p>Comercios corregidos por su Dueño</p>
        </div>
        <div class="alert-card__side">
          <span class="alert-card__count alert-card__count--numero" data-count data-testid="contador-resolicitudes-pendientes"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </a>

      <a class="alert-card alert-card--documentos" href="admin-documentos.html" id="alert-documentos" data-testid="btn-documentos-por-revisar">
        <div class="alert-card__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 11 17 15 13"/></svg>
        </div>
        <div class="alert-card__body">
          <h3>Documentos por revisar</h3>
          <p data-subtitulo data-testid="subtitulo-documentos-por-revisar"><span class="skeleton skeleton-linea-corta"></span></p>
        </div>
        <div class="alert-card__side">
          <span class="alert-card__count alert-card__count--numero" data-count data-testid="contador-documentos-por-revisar"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </a>
      </div>

      <p class="section-heading section-heading--separado">Gestión</p>
      <div class="stat-tile-grid" id="gestion-grid" data-testid="grilla-gestion-admin"></div>

      <div class="admin-cerrar-sesion">
        <button type="button" class="btn-text" id="cerrar-sesion-btn" data-testid="btn-cerrar-sesion">Cerrar sesión</button>
      </div>
    </div>
  </main>
</div>
<script type="module">
import { initAdminDashboard } from './js/admin.js';
initAdminDashboard();
</script>
</body>
</html>
