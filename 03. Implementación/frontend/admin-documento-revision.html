<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revisar documento — Bajoneá</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <button class="app-header__back app-header__back--tactil" type="button" onclick="history.back()" aria-label="Volver" data-testid="btn-volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 class="app-header__title" data-testid="titulo-revision-documento">Revisar documento</h1>
  </header>
  <main class="app-main">
    <div class="screen-body screen-body--tight">
      <div id="revision-aviso" data-testid="aviso-revision"></div>
      <div id="revision-contenido" aria-live="polite" data-testid="contenido-revision"></div>
    </div>
  </main>
</div>
<script type="module">
import { initAdminDocumentoRevision } from './js/admin-documentos.js';
initAdminDocumentoRevision();
</script>
</body>
</html>
