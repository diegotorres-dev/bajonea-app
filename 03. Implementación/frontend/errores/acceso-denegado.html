<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acceso denegado — Bajoneá</title>
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="../css/escritorio.css" media="(min-width: 1024px)" />
</head>
<body>
<div class="app-shell app-shell--escritorio app-shell--acceso">
  <header class="app-header app-header--accent">
    <span class="app-header__title">Acceso denegado</span>
  </header>
  <main class="app-main">
    <div class="state-page">
      <div class="state-page__icon state-page__icon--error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><line x1="12" y1="15" x2="12" y2="17"/></svg>
      </div>
      <h1 class="state-page__title">No tenés acceso a esta página</h1>
      <p class="state-page__text">Tu cuenta no tiene permisos para ver este contenido. Si creés que es un error, contactá a soporte.</p>
      <div class="state-page__actions">
        <a class="btn btn-primary" href="../index.html" data-testid="btn-volver-inicio">Volver al inicio</a>
      </div>
    </div>
  </main>
  <aside class="panel-marca" hidden data-testid="panel-marca">
    <img class="panel-marca__logo" src="../assets/img/bajonea-logo-white.png" alt="Bajoneá" />
    <div class="panel-marca__texto">
      <p class="panel-marca__titular" data-testid="panel-marca-titular">Sin acceso</p>
      <p class="panel-marca__bajada">Tu cuenta no puede ver esta página.</p>
    </div>
  </aside>
</div>
<script type="module">
import { enlazarVolverAlInicio } from '../js/errores.js';
enlazarVolverAlInicio();
</script>
</body>
</html>
