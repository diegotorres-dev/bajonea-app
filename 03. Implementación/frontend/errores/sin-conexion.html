<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sin conexión — Bajoneá</title>
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="app-shell">
  <header class="app-header app-header--accent">
    <span class="app-header__title">Sin conexión</span>
  </header>
  <main class="app-main">
    <div class="state-page">
      <div class="state-page__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
      </div>
      <h1 class="state-page__title">Sin conexión a internet</h1>
      <p class="state-page__text">No pudimos comunicarnos con Bajoneá. Revisá tu conexión a internet e intentá nuevamente.</p>
      <div class="state-page__actions">
        <button class="btn btn-primary" type="button" id="reintentar-btn" data-testid="btn-reintentar">Reintentar</button>
        <a class="btn btn-tertiary" href="../index.html" data-testid="btn-volver-inicio">Volver al inicio</a>
      </div>
    </div>
  </main>
</div>
<script type="module">
const params = new URLSearchParams(window.location.search);
const retorno = params.get('retorno');
document.getElementById('reintentar-btn').addEventListener('click', () => {
  window.location.href = '../' + (retorno || 'index.html');
});
</script>
</body>
</html>
