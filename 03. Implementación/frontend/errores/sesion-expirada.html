<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sesión expirada — Bajoneá</title>
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="app-shell">
  <header class="app-header app-header--accent">
    <span class="app-header__title">Sesión expirada</span>
  </header>
  <main class="app-main">
    <div class="state-page">
      <div class="state-page__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <h1 class="state-page__title">Tu sesión expiró</h1>
      <p class="state-page__text">Por tu seguridad, cerramos tu sesión por inactividad. Volvé a iniciar sesión para continuar.</p>
      <div class="state-page__actions">
        <a class="btn btn-primary" href="../login.html" data-testid="btn-ir-a-login">Ir al inicio de sesión</a>
      </div>
    </div>
  </main>
</div>
</body>
</html>
