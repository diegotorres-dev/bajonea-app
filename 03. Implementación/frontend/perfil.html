<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi perfil — Bajoneá</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app-shell">
  <div id="top-bar-slot"></div>
  <main class="app-main">
    <section id="view-principal" class="perfil-view">
      <div class="profile-header">
        <button type="button" class="profile-header__avatar" id="perfil-avatar" style="border:none;padding:0;cursor:pointer;" data-testid="btn-foto-perfil"></button>
        <input type="file" id="input-avatar" accept="image/jpeg,image/png,image/webp" class="is-hidden" data-testid="input-foto-cliente" />
        <h2 id="perfil-nombre" data-testid="nombre-cliente-perfil"></h2>
        <p id="perfil-email" data-testid="email-cliente-perfil"></p>
      </div>
      <div class="profile-section">
        <p class="profile-section__title">Mi cuenta</p>
        <div class="profile-link-list">
          <button class="profile-link" type="button" id="editar-datos-link" data-testid="btn-editar-datos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
            <span>Editar datos personales</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="profile-link" type="button" id="cambiar-password-link" data-testid="btn-cambiar-password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>Cambiar contraseña</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
      <div class="profile-section">
        <p class="profile-section__title">Sesión</p>
        <div class="profile-link-list">
          <button class="profile-link profile-link--danger" type="button" id="cerrar-sesion-link" data-testid="btn-cerrar-sesion">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Cerrar sesión</span>
          </button>
        </div>
      </div>
    </section>

    <section id="view-editar-datos" class="perfil-view is-hidden">
      <header class="app-header">
        <button class="app-header__back" type="button" data-volver-perfil aria-label="Volver" data-testid="btn-volver-perfil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="app-header__title">Editar datos personales</span>
      </header>
      <div class="screen-body">
        <div id="editar-banner-slot" data-testid="mensaje-banner"></div>
        <form class="form" id="form-editar-datos" novalidate>
          <div class="field">
            <label class="field__label" for="editar-nombre">Nombre</label>
            <div class="input-shell"><input type="text" id="editar-nombre" required maxlength="100" data-testid="input-nombre" /></div>
            <div class="field__error" id="error-editar-nombre" style="display:none;" data-testid="mensaje-error-nombre"></div>
          </div>
          <div class="field">
            <label class="field__label" for="editar-apellido">Apellido</label>
            <div class="input-shell"><input type="text" id="editar-apellido" required maxlength="100" data-testid="input-apellido" /></div>
            <div class="field__error" id="error-editar-apellido" style="display:none;" data-testid="mensaje-error-apellido"></div>
          </div>
          <div class="field">
            <label class="field__label" for="editar-telefono">Teléfono</label>
            <div class="input-shell">
              <span class="input-prefix">+54 9</span>
              <input type="tel" id="editar-telefono" inputmode="numeric" placeholder="2964 000000" required data-testid="input-telefono" />
            </div>
            <div class="field__error" id="error-editar-telefono" style="display:none;" data-testid="mensaje-error-telefono"></div>
          </div>
          <div class="field">
            <label class="field__label" for="editar-email">Email</label>
            <div class="input-shell"><input type="email" id="editar-email" disabled data-testid="input-email" /></div>
            <p class="field__hint">El email no se puede modificar.</p>
          </div>
          <div class="field">
            <label class="field__label" for="editar-dni">DNI</label>
            <div class="input-shell"><input type="text" id="editar-dni" disabled data-testid="input-dni" /></div>
            <p class="field__hint">El DNI no se puede modificar.</p>
          </div>
          <button class="btn btn-primary" type="submit" id="guardar-datos-btn" data-testid="btn-guardar-datos">Guardar</button>
        </form>
      </div>
    </section>

    <section id="view-cambiar-password" class="perfil-view is-hidden">
      <header class="app-header">
        <button class="app-header__back" type="button" data-volver-perfil aria-label="Volver" data-testid="btn-volver-perfil-password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="app-header__title">Cambiar contraseña</span>
      </header>
      <div class="screen-body">
        <div class="banner banner-info" style="margin-bottom:20px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>Por seguridad, ingresá tu contraseña actual.</span>
        </div>
        <div id="password-banner-slot" data-testid="mensaje-banner-password"></div>
        <form class="form" id="form-cambiar-password" novalidate>
          <div class="field">
            <label class="field__label" for="password-actual">Contraseña actual</label>
            <div class="input-shell" id="shell-password-actual">
              <input type="password" id="password-actual" required data-testid="input-password-actual" />
              <button type="button" class="input-shell__toggle" id="toggle-password-actual" aria-label="Mostrar contraseña" data-testid="btn-mostrar-password-actual">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div id="error-password-actual" class="field__error" style="display:none;" data-testid="mensaje-error-password-actual"></div>
          </div>
          <div class="field">
            <label class="field__label" for="password-nueva">Nueva contraseña</label>
            <div class="input-shell">
              <input type="password" id="password-nueva" placeholder="Mínimo 8 caracteres" required data-testid="input-password-nueva" />
              <button type="button" class="input-shell__toggle" id="toggle-password-nueva" aria-label="Mostrar contraseña" data-testid="btn-mostrar-password-nueva">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="strength-meter" id="strength-bars" data-testid="indicador-fortaleza-password">
              <div class="strength-meter__bars">
                <div class="strength-meter__bar"></div>
                <div class="strength-meter__bar"></div>
                <div class="strength-meter__bar"></div>
                <div class="strength-meter__bar"></div>
              </div>
              <span class="strength-meter__label" id="strength-label">Seguridad</span>
            </div>
            <div class="field__error" id="error-password-nueva" style="display:none;" data-testid="mensaje-error-password-nueva"></div>
          </div>
          <div class="field">
            <label class="field__label" for="password-confirmar">Confirmá tu nueva contraseña</label>
            <div class="input-shell">
              <input type="password" id="password-confirmar" placeholder="Repetí tu nueva contraseña" required data-testid="input-password-confirmar" />
              <button type="button" class="input-shell__toggle" id="toggle-password-confirmar" aria-label="Mostrar contraseña" data-testid="btn-mostrar-password-confirmar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="field__error" id="error-password-confirmar" style="display:none;" data-testid="mensaje-error-password-confirmar"></div>
          </div>
          <button class="btn btn-primary" type="submit" id="guardar-password-btn" data-testid="btn-guardar-password">Guardar nueva contraseña</button>
        </form>
      </div>
    </section>
  </main>
  <div id="bottom-nav-slot"></div>
</div>
<script type="module">
import { initPerfil } from './js/cliente.js';
initPerfil();
</script>
</body>
</html>
