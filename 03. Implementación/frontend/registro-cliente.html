<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crear cuenta — Bajoneá</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <button class="app-header__back" type="button" id="back-btn" aria-label="Volver" data-testid="btn-volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="app-header__title">Crear cuenta</span>
  </header>
  <main class="app-main" id="registro-cliente-main">
    <div id="exito-container" class="state-page is-hidden">
      <div class="state-page__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6 12 13 2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
      </div>
      <h1 class="state-page__title">Revisá tu email</h1>
      <p class="state-page__text">Te enviamos un código de 6 dígitos. Ingresalo en la pantalla de verificación para activar tu cuenta y empezar a pedir en Bajoneá.</p>
      <div class="state-page__actions">
        <a class="btn btn-primary" id="ir-a-verificar-link" href="verificar-email.html" data-testid="btn-ir-a-verificar">Ingresar código de verificación</a>
      </div>
    </div>
  </main>
</div>
<script type="module">
import { initRegistroCliente } from './js/auth.js';
initRegistroCliente();
</script>
</body>
</html>
