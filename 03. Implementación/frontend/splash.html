<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bajoneá</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/escritorio.css" media="(min-width: 1024px)" />
</head>
<body>
<aside class="panel-marca" hidden data-testid="panel-marca">
  <img class="panel-marca__logo" src="assets/img/bajonea-logo-white.png" alt="Bajoneá" />
  <div class="panel-marca__texto">
    <p class="panel-marca__titular">Pedí lo que se te antoje.</p>
    <p class="panel-marca__bajada">Comercios gastronómicos de tu zona, en un solo lugar.</p>
  </div>
</aside>
<div class="splash-shell">
  <img src="assets/img/bajonea-logo-white.png" alt="Bajoneá" />
  <div class="splash-progress"><span></span></div>
</div>
<p class="splash-label">Cargando...</p>
<script type="module">
import { getUsuario } from './js/api.js';

const usuario = getUsuario();
const destino = (() => {
  if (!usuario) {
    return 'bienvenida.html';
  }
  if (usuario.rol === 'ADMINISTRADOR') {
    return 'admin-dashboard.html';
  }
  if (usuario.rol === 'DUENO') {
    return 'comercio-dashboard.html';
  }
  return 'index.html';
})();

if (usuario) {
  window.location.replace(destino);
} else {
  setTimeout(() => {
    window.location.href = destino;
  }, 900);
}
</script>
</body>
</html>
