<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bajoneá</title>
<link rel="stylesheet" href="css/styles.css" />
<style>
.splash-shell {
  background: var(--color-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 120px;
}
.splash-shell img {
  width: 220px;
}
.splash-progress {
  width: 120px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.35);
  overflow: hidden;
}
.splash-progress span {
  display: block;
  width: 40%;
  height: 100%;
  background: #ffffff;
  border-radius: 2px;
  animation: splash-loading 1.1s ease-in-out infinite;
}
@keyframes splash-loading {
  0% {
    transform: translateX(-100%);
  }
  100% {
    transform: translateX(340%);
  }
}
.splash-label {
  position: fixed;
  bottom: 40px;
  left: 0;
  right: 0;
  text-align: center;
  color: rgba(255, 255, 255, 0.85);
  font-size: 13px;
  font-family: var(--font-body);
}
</style>
</head>
<body>
<div class="splash-shell">
  <img src="assets/img/bajonea-logo-white.png" alt="Bajoneá" />
  <div class="splash-progress"><span></span></div>
</div>
<p class="splash-label">Cargando...</p>
<script type="module">
import { getUsuario } from './js/api.js';

const usuario = getUsuario();
const destino = (() => {
  if (!usuario) {
    return 'bienvenida.html';
  }
  if (usuario.rol === 'ADMINISTRADOR') {
    return 'admin-dashboard.html';
  }
  if (usuario.rol === 'DUENO') {
    return 'comercio-dashboard.html';
  }
  return 'index.html';
})();

setTimeout(() => {
  window.location.href = destino;
}, 900);
</script>
</body>
</html>
