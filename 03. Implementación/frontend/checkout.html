<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Confirmar pedido — Bajoneá</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <button class="app-header__back" type="button" id="back-btn" aria-label="Volver" data-testid="btn-volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="app-header__title">Confirmar pedido</span>
  </header>
  <main class="app-main">
    <div id="step-progress-container" class="step-progress">
      <div class="step-progress__bars">
        <div class="step-progress__bar step-progress__bar--active"></div>
        <div class="step-progress__bar"></div>
        <div class="step-progress__bar"></div>
      </div>
      <div class="step-progress__labels">
        <span class="is-active">Modalidad</span>
        <span>Dirección / Retiro</span>
        <span>Resumen</span>
      </div>
    </div>
    <div class="screen-body screen-body--tight">
      <div id="banner-slot" data-testid="mensaje-banner"></div>
      <section id="step-1">
        <h1 class="title-md">¿Cómo querés recibir tu pedido?</h1>
        <p class="subtitle">Seleccioná la modalidad de tu pedido</p>
        <div id="delivery-options" class="form" data-testid="opciones-modalidad-entrega"></div>
        <button class="btn btn-primary" type="button" id="continuar-modalidad-btn" style="margin-top:20px;" disabled data-testid="btn-continuar-modalidad">Continuar</button>
      </section>
      <section id="step-2" class="is-hidden">
        <div id="step-2-content"></div>
      </section>
      <section id="step-3" class="is-hidden">
        <div id="step-3-content"></div>
      </section>
    </div>
  </main>
</div>
<script type="module">
import { initCheckout } from './js/checkout.js';
initCheckout();
</script>
</body>
</html>
