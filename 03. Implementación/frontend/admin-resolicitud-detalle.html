<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revisión de re-solicitud — Bajoneá</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app-shell">
  <header class="app-header app-header--con-pill">
    <button class="app-header__back" type="button" onclick="history.back()" aria-label="Volver" data-testid="btn-volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="app-header__title">Re-solicitud</span>
    <span class="app-header__pill is-hidden" id="intento-badge" data-testid="badge-intento"></span>
  </header>
  <main class="app-main">
    <div id="detalle-content" data-testid="detalle-resolicitud" aria-busy="true">
      <div class="screen-body screen-body--tight">
        <div class="skeleton" style="height:96px;width:100%;margin-bottom:16px;"></div>
        <div class="skeleton" style="height:72px;width:100%;margin-bottom:16px;"></div>
        <div class="skeleton" style="height:120px;width:100%;margin-bottom:16px;"></div>
      </div>
    </div>
  </main>
</div>
<script type="module">
import { initAdminResolicitudDetalle } from './js/admin.js';
initAdminResolicitudDetalle();
</script>
</body>
</html>
