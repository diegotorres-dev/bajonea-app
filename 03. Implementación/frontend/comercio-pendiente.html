<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Comercio pendiente de aprobación — Bajoneá</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/escritorio.css" media="(min-width: 1024px)" />
</head>
<body>
<div class="app-shell app-shell--escritorio app-shell--acceso">
  <header class="app-header app-header--brand">
    <img class="header-logo" src="assets/img/bajonea-logo-orange-header.png" alt="Bajoneá" />
  </header>
  <main class="app-main">
    <div class="state-page state-page--centrado-vertical">
      <div class="revision-alert">
        <div class="revision-alert__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="revision-alert__body">
          <h1 class="revision-alert__title">En revisión</h1>
          <p class="revision-alert__text">Tu solicitud fue enviada correctamente y está siendo evaluada por el equipo de Bajoneá. Te informaremos vía email</p>
          <span class="pill pill--primary revision-alert__pill">Pendiente de aprobación</span>
        </div>
      </div>
      <div class="state-page__actions">
        <button class="btn btn-primary" type="button" id="logout-btn" data-testid="btn-ir-a-inicio">Ir a la pantalla principal</button>
        <button class="btn btn-secondary" type="button" id="volver-comercios-btn" data-testid="btn-volver-a-mis-comercios">Volver a mis comercios</button>
      </div>
    </div>
  </main>
  <aside class="panel-marca" hidden data-testid="panel-marca">
    <img class="panel-marca__logo" src="assets/img/bajonea-logo-white.png" alt="Bajoneá" />
    <div class="panel-marca__texto">
      <p class="panel-marca__titular" data-testid="panel-marca-titular">Estamos revisando tu comercio.</p>
      <p class="panel-marca__bajada">Te avisamos por acá apenas lo aprobemos.</p>
    </div>
  </aside>
  <nav class="acceso-legal" hidden aria-label="Información legal" data-testid="panel-legal">
    <a class="acceso-legal__enlace" href="terminos.html" data-testid="panel-legal-terminos">Términos y Condiciones</a>
    <a class="acceso-legal__enlace" href="privacidad.html" data-testid="panel-legal-privacidad">Política de Privacidad</a>
    <a class="acceso-legal__enlace" href="faq.html" data-testid="panel-legal-faq">Preguntas frecuentes</a>
  </nav>
</div>
<script type="module">
import { logout } from './js/auth.js';
import { initComercioEstadoPagina } from './js/comercio.js';
initComercioEstadoPagina('PENDIENTE');
document.getElementById('logout-btn').addEventListener('click', () => logout('index.html'));
</script>
</body>
</html>
