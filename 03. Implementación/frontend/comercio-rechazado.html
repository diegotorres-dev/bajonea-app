<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solicitud de comercio rechazada — Bajoneá</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app-shell">
  <header class="app-header app-header--brand">
    <img class="header-logo" src="assets/img/bajonea-logo-orange-header.png" alt="Bajoneá" />
  </header>
  <main class="app-main">
    <div id="cargando-container" class="state-page" aria-busy="true" data-testid="skeleton-rechazado">
      <div class="skeleton" style="height:64px;width:64px;border-radius:50%;margin-bottom:16px;"></div>
      <div class="skeleton" style="height:28px;width:220px;margin-bottom:12px;"></div>
      <div class="skeleton" style="height:72px;width:100%;max-width:320px;margin-bottom:24px;"></div>
      <div class="skeleton" style="height:48px;width:100%;max-width:320px;"></div>
    </div>
    <div id="contenido-container" class="state-page is-hidden">
      <div class="state-page__icon state-page__icon--error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </div>
      <h1 class="state-page__title">Tu solicitud fue rechazada</h1>
      <div id="motivo-rechazo-slot" class="motivo-rechazo-slot"></div>
      <p class="state-page__text" id="texto-correccion" data-testid="texto-correccion"></p>
      <div class="state-page__actions">
        <a class="btn btn-primary is-hidden" id="corregir-btn" data-testid="btn-corregir-solicitud">Corregir y volver a solicitar</a>
        <button class="btn btn-secondary" type="button" id="volver-comercios-btn" data-testid="btn-volver-a-mis-comercios">Volver a mis comercios</button>
        <button class="btn btn-secondary" type="button" id="logout-btn" data-testid="btn-cerrar-sesion">Cerrar sesión</button>
      </div>
    </div>
  </main>
</div>
<script type="module">
import { logout } from './js/auth.js';
import { initComercioRechazado } from './js/comercio.js';
initComercioRechazado();
document.getElementById('logout-btn').addEventListener('click', () => logout());
</script>
</body>
</html>
