<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solicitud de comercio rechazada — Bajoneá</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/escritorio.css" media="(min-width: 1024px)" />
</head>
<body>
<div class="app-shell app-shell--escritorio app-shell--acceso">
  <header class="app-header app-header--brand">
    <img class="header-logo" src="assets/img/bajonea-logo-orange-header.png" alt="Bajoneá" />
  </header>
  <main class="app-main">
    <div id="cargando-container" class="state-page" aria-busy="true" data-testid="skeleton-rechazado">
      <div class="skeleton u-esqueleto-avatar-64"></div>
      <div class="skeleton u-h-28px-w-220px-mb-12px"></div>
      <div class="skeleton u-h-72px-w-100-mw-320px-mb-24px"></div>
      <div class="skeleton u-h-48px-w-100-mw-320px"></div>
    </div>
    <div id="contenido-container" class="state-page is-hidden">
      <div class="state-page__icon state-page__icon--error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </div>
      <h1 class="state-page__title">Tu solicitud fue rechazada</h1>
      <div id="motivo-rechazo-slot" class="motivo-rechazo-slot"></div>
      <p class="state-page__text" id="texto-correccion" data-testid="texto-correccion"></p>
      <div class="state-page__actions">
        <a class="btn btn-primary is-hidden" id="corregir-btn" data-testid="btn-corregir-solicitud">Corregir y volver a solicitar</a>
        <button class="btn btn-secondary" type="button" id="volver-comercios-btn" data-testid="btn-volver-a-mis-comercios">Volver a mis comercios</button>
        <button class="btn btn-secondary" type="button" id="logout-btn" data-testid="btn-cerrar-sesion">Cerrar sesión</button>
      </div>
    </div>
  </main>
  <aside class="panel-marca" hidden data-testid="panel-marca">
    <img class="panel-marca__logo" src="assets/img/bajonea-logo-white.png" alt="Bajoneá" />
    <div class="panel-marca__texto">
      <p class="panel-marca__titular" data-testid="panel-marca-titular">Tu solicitud necesita cambios.</p>
      <p class="panel-marca__bajada">Corregí lo que te indicamos y volvé a enviarla.</p>
    </div>
    <nav class="panel-marca__legal" aria-label="Información legal" data-testid="panel-legal">
      <a class="panel-marca__enlace" href="terminos.html" data-testid="panel-legal-terminos">Términos y Condiciones</a>
      <a class="panel-marca__enlace" href="privacidad.html" data-testid="panel-legal-privacidad">Política de Privacidad</a>
      <a class="panel-marca__enlace" href="faq.html" data-testid="panel-legal-faq">Preguntas frecuentes</a>
    </nav>
  </aside>
</div>
<script type="module">
import { logout } from './js/auth.js';
import { initComercioRechazado } from './js/comercio.js';
initComercioRechazado();
document.getElementById('logout-btn').addEventListener('click', () => logout());
</script>
</body>
</html>
